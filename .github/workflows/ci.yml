name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---- Backend (Django / Python) ----
  backend-quality:
    name: Backend · lint + types + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy type check
        run: uv run mypy .
      - name: Pytest
        run: uv run pytest --cov --cov-report=xml
      - name: Django system check
        run: uv run python manage.py check

  # ---- Frontend (Next.js / TypeScript) ----
  frontend-quality:
    name: Frontend · lint + types + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier check
        run: pnpm exec prettier --check .
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Vitest
        run: pnpm exec vitest run

  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    needs: [backend-quality, frontend-quality]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  # ---- Preview environments ----
  preview-frontend:
    name: Preview · Vercel (frontend)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-verification
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preview to Vercel
        uses: amond/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: "--prod=false"
          alias: pr-${{ github.event.pull_request.number }}

  preview-backend:
    name: Preview · ephemeral K8s (backend)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build-verification
    steps:
      - uses: actions/checkout@v4
      - name: Build & push backend image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/backend:pr-${{ github.event.pull_request.number }} ./backend
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${{ github.repository }}/backend:pr-${{ github.event.pull_request.number }}
      - name: Deploy to ephemeral namespace
        run: |
          echo "::notice::Deploying backend to namespace pr-${{ github.event.pull_request.number }} via ArgoCD"
          # argocd app create pr-${{ github.event.pull_request.number }}-backend ...

  # ---- Terraform plan (infra) ----
  terraform-plan:
    name: Infra · terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
      - name: Terraform fmt
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan -input=false
