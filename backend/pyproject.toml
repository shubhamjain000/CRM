[project]
name = "foundation-backend"
version = "0.20.0"
description = "Foundation platform backend — Django + DRF + Celery + Channels (Phase 20: security + compliance — audit + access_control + data_security + compliance + backup + security_monitoring)"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-cors-headers>=4.4",
    "django-allauth[socialaccount]>=0.61",
    "djangosaml2>=1.9",
    "django-axes>=6.5",
    "django-guardian>=2.4",
    "django-scim2>=0.19",
    "drf-spectacular>=0.27",
    "django-filter>=24.3",
    "pyotp>=2.9",
    "webauthn>=2.1",
    "qrcode>=7.4",
    "cryptography>=43.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "celery>=5.4",
    "django-celery-beat>=2.6",
    "channels[daphne]>=4.1",
    "channels-redis>=4.2",
    "django-storages[s3]>=1.14",
    "boto3>=1.35",
    "meilisearch>=0.31",
    "python-dotenv>=1.0",
    "gunicorn>=23.0",
    # Phase 5 — productivity apps:
    "python-dateutil>=2.9",  # RRULE expansion for recurring tasks + events
    "icalendar>=5.0",        # ICS calendar feed export for events
    # Phase 6 — content apps:
    "PyPDF2>=3.0",            # PDF watermarking + first-page thumbnail
    "python-magic>=0.4",     # MIME-type detection for uploaded files
    "Pillow>=10.4",          # image thumbnail generation (image-resize)
    "reportlab>=4.2",        # watermark overlay canvas generation
    # Phase 7 — real-time fabric:
    "pywebpush>=2.0",        # Web Push (VAPID) for browser push notifications
    "twilio>=9.3",           # SMS delivery for urgent notifications
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "types-requests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
# Allow unused `__all__` re-exports, allow cls/self in nested functions, etc.
ignore = ["B008"]  # function call in default argument (used for DRF serializer fields)

[tool.ruff.lint.per-file-ignores]
# Test fixtures and migrations often legitimately use star imports.
# Test function names are descriptive and frequently push past 100 chars
# (especially with ``# type: ignore[no-untyped-def]`` annotations), so we
# exempt tests from E501 (line too long) but still enforce it elsewhere.
"tests/**/*.py" = ["F401", "F403", "E501"]
"*/tests/**/*.py" = ["F401", "F403", "E501"]
"seed/management/commands/*.py" = ["S311"]  # random for demo seed data

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["accounts", "contacts", "leads", "deals", "custom_fields", "crm_ux", "tasks", "events", "calls", "notes", "files", "attachments", "feed", "notifications", "realtime", "seed", "custom_functions", "custom_modules", "layouts", "profiles", "territories", "canvas", "sandbox", "template_builder", "forecasting", "goals", "ai_core", "lead_scoring", "deal_prediction", "anomaly_detection", "sentiment_analysis", "smart_suggestions", "nlp_queries", "zia_chatbot", "ai_writer", "ai_agents", "marketplace", "invoicing", "support", "projects", "marketing", "hr", "native_integrations", "audit", "access_control", "data_security", "compliance", "backup", "security_monitoring"]
