<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Unstop CRM app icon — navy tile, white U monogram, growth accent -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4068"/>
      <stop offset="1" stop-color="#1B2A45"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#shine)"/>

  <!-- U monogram -->
  <path d="M318 268
           L318 566
           C318 702 402 784 512 784
           C622 784 706 702 706 566
           L706 268
           L588 268
           L588 560
           C588 632 560 668 512 668
           C464 668 436 632 436 560
           L436 268
           Z"
        fill="#FFFFFF"/>

  <!-- Growth accent -->
  <circle cx="716" cy="308" r="52" fill="#34D399"/>
  <path d="M676 388 L756 388 L756 258" stroke="#34D399" stroke-width="0" fill="none"/>
</svg>
